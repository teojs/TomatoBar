name: Package

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ImageMagick
        run: brew install imagemagick

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          if [[ ! "${PLIST_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Info.plist 的 CFBundleShortVersionString 必须是 x.y.z，当前是: ${PLIST_VERSION}" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${VERSION}" != "${PLIST_VERSION}" ]]; then
              echo "tag ${GITHUB_REF_NAME} 和 Info.plist 的 ${PLIST_VERSION} 不一致。" >&2
              echo "先把 CFBundleShortVersionString 改成 ${VERSION} 并推到 main，再打 tag。" >&2
              exit 1
            fi
            echo "release=true" >> "${GITHUB_OUTPUT}"
          else
            VERSION="${PLIST_VERSION}"
            echo "release=false" >> "${GITHUB_OUTPUT}"
          fi

          echo "marketing=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "build=${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Build app
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: ./build_app.sh

      - name: Zip app
        run: |
          set -euo pipefail
          ditto -c -k --keepParent \
            "dist/TomatoBar.app" \
            "dist/TomatoBar-${{ steps.version.outputs.marketing }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TomatoBar-${{ steps.version.outputs.marketing }}-${{ steps.version.outputs.build }}
          path: dist/TomatoBar-${{ steps.version.outputs.marketing }}.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "dist/TomatoBar-${{ steps.version.outputs.marketing }}.zip" \
            --title "TomatoBar ${{ steps.version.outputs.marketing }}" \
            --generate-notes
